<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Enora</title>
  <link rel="icon" href="icon.png" />
  <!-- Version web installable (PWA) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0e0f14" />
  <meta name="description" content="Enora : musique par style, films, radios du monde entier, favoris et playlists synchronisés." />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Enora" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Navigation (barre latérale sur ordinateur, barre d'onglets sur iPhone) -->
    <nav id="nav">
      <div class="brand" role="button" tabindex="0" title="Retour à la Bibliothèque"><span class="logo" data-icon="music"></span><span class="brand-name">Enora</span></div>
      <button class="nav-item active" data-view="library"><span class="ico" data-icon="library"></span><span>Bibliothèque</span></button>
      <button class="nav-item" data-view="music"><span class="ico" data-icon="music"></span><span>Musique</span></button>
      <button class="nav-item" data-view="films" title="Films, séries et TV en direct"><span class="ico" data-icon="film"></span><span>Films &amp; TV</span></button>
      <button class="nav-item" data-view="radio" title="Radios et podcasts"><span class="ico" data-icon="radio"></span><span>Radio</span></button>
      <button class="nav-item" data-view="game" title="Blind test"><span class="ico" data-icon="game"></span><span>Jeu</span></button>
      <button class="nav-item" data-view="about"><span class="ico" data-icon="info"></span><span>Infos</span></button>
      <button class="nav-item" data-view="settings"><span class="ico" data-icon="settings"></span><span>Réglages</span></button>
      <div class="nav-foot">Sans publicité · Hors ligne</div>
    </nav>

    <!-- Contenu principal -->
    <main id="main">
      <div id="view"></div>
      <!-- La vue YouTube est gardée en mémoire pour ne pas recharger la page -->
      <div id="yt-container" class="hidden"></div>
      <div id="web-container" class="hidden"></div>
    </main>

    <!-- Mini-lecteur -->
    <footer id="mini" class="hidden">
      <div class="mini-progress"><div id="mini-bar"></div></div>
      <div class="mini-inner">
        <div class="mini-info" id="mini-open">
          <img id="mini-cover" alt="" />
          <div class="mini-text">
            <div id="mini-title" class="ellipsis">—</div>
            <div id="mini-artist" class="ellipsis muted">—</div>
          </div>
        </div>
        <div class="mini-ctrl">
          <button id="mini-prev" class="icon-btn" title="Précédent" data-icon="prev"></button>
          <button id="mini-play" class="icon-btn big" title="Lecture/Pause" data-icon="play"></button>
          <button id="mini-next" class="icon-btn" title="Suivant" data-icon="next"></button>
        </div>
        <div class="mini-extra">
          <span id="mini-time" class="muted small">0:00 / 0:00</span>
          <input id="mini-vol" type="range" min="0" max="1" step="0.01" value="1" title="Volume" />
          <button id="mini-compact" class="icon-btn hidden" title="Mini-lecteur flottant" data-icon="pip"></button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Lecteur plein écran -->
  <section id="np" class="sheet hidden">
    <div class="np-head">
      <button id="np-close" class="icon-btn" title="Réduire" data-icon="chevronDown"></button>
      <span class="muted small">EN COURS DE LECTURE</span>
      <button id="np-video-toggle" class="icon-btn hidden" title="Vidéo" data-icon="video"></button>
    </div>
    <div class="np-body">
      <div id="np-media">
        <img id="np-cover" alt="" />
        <video id="video-el" playsinline webkit-playsinline preload="metadata" class="hidden"></video>
        <div id="np-yt-slot" class="hidden"></div>
      </div>
      <div class="np-meta">
        <h2 id="np-title" class="ellipsis">—</h2>
        <div id="np-artist" class="muted ellipsis">—</div>
      </div>
      <div class="np-seek">
        <span id="np-cur" class="small muted">0:00</span>
        <input id="np-range" type="range" min="0" max="1000" value="0" />
        <span id="np-dur" class="small muted">0:00</span>
      </div>
      <div class="np-ctrl">
        <button id="np-shuffle" class="icon-btn" title="Aléatoire" data-icon="shuffle"></button>
        <button id="np-prev" class="icon-btn" title="Précédent" data-icon="prev"></button>
        <button id="np-play" class="icon-btn huge" title="Lecture/Pause" data-icon="play"></button>
        <button id="np-next" class="icon-btn" title="Suivant" data-icon="next"></button>
        <button id="np-repeat" class="icon-btn" title="Répéter" data-icon="repeat"></button>
      </div>
      <div class="np-tools">
        <button id="np-fav" class="pill">Favori</button>
        <button id="np-addpl" class="pill">Ajouter à une playlist</button>
        <button id="np-info" class="pill">Infos du titre</button>
        <button id="np-radio" class="pill">Radio du titre</button>
        <button id="np-room" class="pill">Écouter à plusieurs</button>
        <select id="np-sleep" class="pill" title="Minuterie de sommeil">
          <option value="0">Minuterie : désactivée</option>
          <option value="15">Arrêt dans 15 min</option>
          <option value="30">Arrêt dans 30 min</option>
          <option value="60">Arrêt dans 1 h</option>
          <option value="end">Arrêt à la fin du titre</option>
        </select>
      </div>
      <div id="np-lyrics" class="lyrics hidden"></div>
      <button id="np-addlrc" class="pill hidden" style="margin:14px auto 0;display:none">Ajouter des paroles (.lrc)</button>
      <div class="np-qrow"><h3 class="np-qh">File d'attente</h3><button id="np-saveq" class="pill">Enregistrer en playlist</button></div>
      <div id="np-queue" class="list"></div>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast hidden"></div>

  <!-- Lecteur YouTube officiel : affiché dans le lecteur plein écran, sinon gardé hors de l'écran -->
  <div id="yt-host" class="offscreen"></div>
  <audio id="audio-el" preload="none"></audio>
  <!-- Fichiers sur l'appareil : passent par l'égaliseur (Web Audio) -->
  <audio id="audio-fx" preload="none"></audio>
  <audio id="audio-fx2" preload="none"></audio>
  <input id="list-input" type="file" accept=".txt,.csv,.tsv,text/plain,text/csv" class="hidden" />
  <input id="lrc-input" type="file" accept=".lrc,.txt,text/plain" class="hidden" />
  <input id="file-input" type="file" multiple class="hidden"
    accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.mp4,.m4v,.mov,.webm" />

  <script type="module" src="js/app.js"></script>
</body>
</html>
