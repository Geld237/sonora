name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Que se passe-t-il ?
      description: Décrivez le problème et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Comment le reproduire
      placeholder: "1. Ouvrir Musique  2. Choisir Cameroun  3. …"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options: [Windows, Android, iPhone, Version web (PWA)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version d'Enora
      description: Visible dans l'onglet Infos.
      placeholder: "1.2.0"
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran ou message d'erreur
