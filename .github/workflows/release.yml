# Publie une nouvelle version de Enora sur GitHub (Windows, Android, iPhone) en une fois.
# Lancement : onglet « Actions » > « Release » > « Run workflow » > numéro de version (ex. 1.1.0).
# Les applications installées détectent ensuite la nouvelle version (voir README).
# La version web (PWA) est publiée par le workflow « Site web (PWA) » à chaque envoi sur main.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 1.1.0)"
        required: true
  push:
    tags: ["v*"]
    # Envoyer la branche « release » publie la version indiquée dans package.json
    branches: [release]

permissions:
  contents: write

# Compte Enora (Firebase) : identifiants lus dans les secrets du dépôt
env:
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
  # Sites préconfigurés (onglet Films & TV) : variable ou secret SONORA_SITES, un par ligne « Nom | https://adresse »
  SONORA_SITES: ${{ vars.SONORA_SITES || secrets.SONORA_SITES }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then RAW="${{ github.event.inputs.version }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then RAW="${{ github.ref_name }}";
          else RAW=$(node -p "require('./package.json').version"); fi
          V="${RAW#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Enora ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Télécharger Enora ${{ steps.v.outputs.version }}
            - **Windows** : `Enora-Setup-${{ steps.v.outputs.version }}.exe` (installateur, mises à jour automatiques) ou `Enora-Portable-${{ steps.v.outputs.version }}.exe`
            - **Mac** (Intel et Apple Silicon) : `Enora-Mac-${{ steps.v.outputs.version }}.dmg` — 1er lancement : clic droit sur Enora > Ouvrir
            - **Linux** : `Enora-Linux-${{ steps.v.outputs.version }}.AppImage` (mises à jour automatiques) ou `.deb`
            - **Android** : `Enora-Android-${{ steps.v.outputs.version }}.apk` (autorisez « Installer des applis inconnues »)
            - **iPhone** : `Enora-iPhone-${{ steps.v.outputs.version }}.ipa`, à installer avec Sideloadly depuis Windows (voir README)
            - **Play Store** : `Enora-PlayStore-${{ steps.v.outputs.version }}.aab`, à envoyer dans la Google Play Console
            - **Version web (PWA)** : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (iPhone : Safari > Partager > Sur l'écran d'accueil)

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        shell: bash
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
          node scripts/write-build-info.js github
      - run: npm ci
      - name: Compiler l'installateur et la version portable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:exe -- --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist-exe/*.exe
            dist-exe/*.blockmap
            dist-exe/latest.yml

  mac:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
          node scripts/write-build-info.js github
      - run: npm ci
      - name: "Compiler l'application Mac (Intel + Apple Silicon)"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac -- --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist-exe/*.dmg
            dist-exe/*.zip
            dist-exe/latest-mac.yml

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
          node scripts/write-build-info.js github
      - run: npm ci
      - name: "Compiler l'application Linux (AppImage + deb)"
        run: npm run build:linux -- --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist-exe/*.AppImage
            dist-exe/*.deb
            dist-exe/latest-linux.yml

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        run: npm version "$VERSION_NAME" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Clé de signature (secrets GitHub)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sonora-upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sonora-upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé Android dans les secrets : APK de test uniquement, pas de fichier Play Store."
          fi
      - name: APK (version GitHub complète)
        run: |
          node scripts/write-build-info.js github
          npm run android:sync
          cd android && chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease || (sleep 20 && ./gradlew --no-daemon assembleRelease)
            cp app/build/outputs/apk/release/app-release.apk "../Enora-Android-$VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug || (sleep 20 && ./gradlew --no-daemon assembleDebug)
            cp app/build/outputs/apk/debug/app-debug.apk "../Enora-Android-$VERSION_NAME.apk"
          fi
      - name: AAB (version Play Store)
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          node scripts/write-build-info.js play
          npm run android:sync
          cd android && (./gradlew --no-daemon bundleRelease || (sleep 20 && ./gradlew --no-daemon bundleRelease))
          cp app/build/outputs/bundle/release/app-release.aab "../Enora-PlayStore-$VERSION_NAME.aab"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            Enora-Android-*.apk
            Enora-PlayStore-*.aab

  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choisir la version la plus récente de Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Version
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
          node scripts/write-build-info.js github
      - run: npm ci
      - run: npm run ios:sync
      - name: "Compiler (sans signature, Sideloadly signera l app)"
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="${{ needs.prepare.outputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "../../Enora-iPhone-${{ needs.prepare.outputs.version }}.ipa" Payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: Enora-iPhone-*.ipa

