# Publie une nouvelle version de Sonora sur GitHub (Windows, Android, iPhone) en une fois.
# Lancement : onglet « Actions » > « Release » > « Run workflow » > numéro de version (ex. 1.1.0).
# Les applications installées détectent ensuite la nouvelle version (voir README).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. 1.1.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          V="${RAW#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Sonora ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Télécharger Sonora ${{ steps.v.outputs.version }}
            - **Windows** : `Sonora-Setup-${{ steps.v.outputs.version }}.exe` (installateur, mises à jour automatiques) ou `Sonora-Portable-${{ steps.v.outputs.version }}.exe`
            - **Android** : `Sonora-Android-${{ steps.v.outputs.version }}.apk` (autorisez « Installer des applis inconnues »)
            - **iPhone** : `Sonora-iPhone-${{ steps.v.outputs.version }}.ipa`, à installer avec Sideloadly depuis Windows (voir README)
            - **Play Store** : `Sonora-PlayStore-${{ steps.v.outputs.version }}.aab`, à envoyer dans la Google Play Console
            - **Version web (PWA)** : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (iPhone : Safari > Partager > Sur l'écran d'accueil)

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        shell: bash
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
          node scripts/write-build-info.js github
      - run: npm ci
      - name: Compiler l'installateur et la version portable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:exe -- --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist-exe/*.exe
            dist-exe/*.blockmap
            dist-exe/latest.yml

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        run: npm version "$VERSION_NAME" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Clé de signature (secrets GitHub)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sonora-upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sonora-upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé Android dans les secrets : APK de test uniquement, pas de fichier Play Store."
          fi
      - name: APK (version GitHub complète)
        run: |
          node scripts/write-build-info.js github
          npm run android:sync
          cd android && chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../Sonora-Android-$VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../Sonora-Android-$VERSION_NAME.apk"
          fi
      - name: AAB (version Play Store)
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          node scripts/write-build-info.js play
          npm run android:sync
          cd android && ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "../Sonora-PlayStore-$VERSION_NAME.aab"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            Sonora-Android-*.apk
            Sonora-PlayStore-*.aab

  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choisir la version la plus récente de Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Version
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
          node scripts/write-build-info.js github
      - run: npm ci
      - run: npm run ios:sync
      - name: "Compiler (sans signature, Sideloadly signera l app)"
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="${{ needs.prepare.outputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "../../Sonora-iPhone-${{ needs.prepare.outputs.version }}.ipa" Payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: Sonora-iPhone-*.ipa

  pages:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer la version web
        run: |
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
          node scripts/write-build-info.js web
          sed -i "s/__BUILD__/${{ needs.prepare.outputs.version }}-${GITHUB_SHA::7}/" www/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
