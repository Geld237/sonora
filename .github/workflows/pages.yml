# Publie la version web installable (PWA) de Enora sur GitHub Pages à chaque envoi sur la branche main.
# Prérequis (une seule fois) : Settings > Pages > Source : « GitHub Actions ».
name: Site web (PWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Compte Enora (Firebase) : identifiants lus dans les secrets du dépôt
env:
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  # Sites préconfigurés (onglet Films & TV) : variable ou secret SONORA_SITES, un par ligne « Nom | https://adresse »
  SONORA_SITES: ${{ vars.SONORA_SITES || secrets.SONORA_SITES }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer la version web
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          VER=$(node -p "require('./package.json').version")
          node scripts/write-build-info.js web
          sed -i "s/__BUILD__/$VER-${GITHUB_SHA::7}/" www/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
