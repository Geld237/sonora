<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Logo d'Enora : un « E » dont les trois barres ont des longueurs différentes, comme les niveaux d'un égaliseur. Fond plein (les systèmes arrondissent eux-mêmes les coins). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c7a"/><stop offset=".55" stop-color="#ff375f"/><stop offset="1" stop-color="#c2255c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#g)"/>
  <path d="M700 290H350V734H670M350 512H590" fill="none" stroke="#fff" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
